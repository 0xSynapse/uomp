<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MCP path">
  <rect x="0" y="0" width="720" height="260" fill="#FFFFFF"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0A0A0A"/></marker>
    <marker id="r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6B7280"/></marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" fill="#0891B2" font-size="13" font-family="Inter, system-ui, sans-serif" font-weight="700">MCP path (local adapter, experimental)</text>
  <text x="360" y="42" text-anchor="middle" fill="#6B7280" font-size="10" font-family="Inter, system-ui, sans-serif">MCP client ⇄ stdio JSON-RPC ⇄ uomp mcp ⇄ HTTP + Token ⇄ Auth + Guard</text>

  <rect x="25" y="80" width="170" height="60" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/>
  <text x="110" y="105" text-anchor="middle" fill="#0891B2" font-size="12" font-family="Inter, system-ui, sans-serif" font-weight="700">MCP client</text>
  <text x="110" y="124" text-anchor="middle" fill="#6B7280" font-size="9" font-family="Inter, system-ui, sans-serif">Claude Desktop / Cursor / OpenCode</text>

  <rect x="245" y="80" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
  <text x="325" y="105" text-anchor="middle" fill="#0A0A0A" font-size="12" font-family="Inter, system-ui, sans-serif" font-weight="700">uomp mcp</text>
  <text x="325" y="124" text-anchor="middle" fill="#6B7280" font-size="9" font-family="Inter, system-ui, sans-serif">stdio bridge</text>

  <rect x="465" y="80" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
  <text x="555" y="105" text-anchor="middle" fill="#0A0A0A" font-size="12" font-family="Inter, system-ui, sans-serif" font-weight="700">Auth + Guard</text>
  <text x="555" y="124" text-anchor="middle" fill="#6B7280" font-size="9" font-family="Inter, system-ui, sans-serif">127.0.0.1:9374</text>

  <rect x="465" y="180" width="180" height="44" rx="8" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="555" y="207" text-anchor="middle" fill="#059669" font-size="11" font-family="Inter, system-ui, sans-serif" font-weight="600">Store + Audit</text>

  <rect x="245" y="175" width="160" height="44" rx="8" fill="#FAFAF8" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="325" y="194" text-anchor="middle" fill="#0A0A0A" font-size="10" font-family="Inter, system-ui, sans-serif" font-weight="600">session.env 0600</text>
  <text x="325" y="209" text-anchor="middle" fill="#6B7280" font-size="8.5" font-family="Inter, system-ui, sans-serif">UOM_TOKEN + base URL</text>

  <line x1="195" y1="105" x2="245" y2="105" stroke="#0A0A0A" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="220" y="97" text-anchor="middle" fill="#6B7280" font-size="8.5" font-family="Inter, system-ui, sans-serif">stdio</text>

  <line x1="405" y1="105" x2="465" y2="105" stroke="#0A0A0A" stroke-width="2" marker-end="url(#a)"/>
  <text x="435" y="97" text-anchor="middle" fill="#6B7280" font-size="8.5" font-family="Inter, system-ui, sans-serif">HTTP</text>

  <line x1="555" y1="140" x2="555" y2="180" stroke="#059669" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="565" y="163" text-anchor="start" fill="#6B7280" font-size="8.5" font-family="Inter, system-ui, sans-serif">filter / log</text>

  <line x1="325" y1="175" x2="325" y2="140" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#r)"/>
  <text x="335" y="161" text-anchor="start" fill="#6B7280" font-size="8.5" font-family="Inter, system-ui, sans-serif">re-read token</text>

  <text x="360" y="250" text-anchor="middle" fill="#6B7280" font-size="9" font-family="Inter, system-ui, sans-serif">The MCP bridge only adapts transport; Guard still enforces scope, expiry, revocation, and audit</text>
</svg>
