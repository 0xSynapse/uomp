<svg viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="远程路径">
  <rect x="0" y="0" width="960" height="360" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#B45309"/></marker>
  </defs>

  <text x="480" y="32" text-anchor="middle" fill="#B45309" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">远程路径（可选 / 高级）</text>
  <text x="480" y="55" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="11">Gateway 是受控远程入口；Cloud Relay 仍为设计/预览，不在本图展开</text>

  <rect x="50" y="95" width="400" height="210" rx="12" fill="#FAFAF8" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="250" y="120" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">用户本机</text>

  <rect x="80" y="135" width="340" height="70" rx="10" fill="#FFFFFF" stroke="#111210" stroke-width="2"/>
  <text x="250" y="166" text-anchor="middle" fill="#111210" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Auth + Guard</text>
  <text x="250" y="187" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="10">127.0.0.1:9374</text>

  <rect x="80" y="235" width="340" height="60" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.8"/>
  <text x="250" y="261" text-anchor="middle" fill="#92400E" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">Gateway + Tunnel</text>
  <text x="250" y="280" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="9.5">mTLS · Cloudflare Tunnel</text>

  <rect x="710" y="160" width="200" height="76" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.8"/>
  <text x="810" y="193" text-anchor="middle" fill="#0E7490" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">Remote Agent</text>
  <text x="810" y="213" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="9.5">cloud / VPS / container</text>

  <line x1="250" y1="205" x2="250" y2="235" stroke="#B45309" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="262" y="225" text-anchor="start" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="9">local</text>

  <line x1="420" y1="265" x2="710" y2="198" stroke="#B45309" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="220" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="9.5">TLS + Token</text>

  <text x="480" y="340" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="9.5">可选/高级：Auth 签发 Token → 用户交付给 Agent → Agent 经 Gateway → Guard → Store</text>
</svg>
