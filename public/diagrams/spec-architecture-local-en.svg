<svg viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Local path">
  <rect x="0" y="0" width="960" height="380" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#111210"/></marker>
    <marker id="arrow-soft" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#6B7280"/></marker>
  </defs>

  <text x="480" y="32" text-anchor="middle" fill="#111210" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Local path (default / current)</text>
  <text x="480" y="55" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="11">CLI authorize → 0600 session env → Agent / MCP client → Guard filter &amp; audit → revoke</text>

  <rect x="50" y="110" width="190" height="76" rx="10" fill="#FFFFFF" stroke="#111210" stroke-width="2"/>
  <text x="145" y="143" text-anchor="middle" fill="#111210" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">CLI</text>
  <text x="145" y="163" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="10">authorize / revoke</text>

  <rect x="400" y="105" width="230" height="86" rx="10" fill="#FFFFFF" stroke="#111210" stroke-width="2"/>
  <text x="515" y="140" text-anchor="middle" fill="#111210" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Auth + Guard</text>
  <text x="515" y="161" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="10">127.0.0.1:9374</text>

  <rect x="740" y="105" width="180" height="86" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.8"/>
  <text x="830" y="140" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">Store + Audit</text>
  <text x="830" y="161" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="10">SQLite + audit log</text>

  <rect x="50" y="270" width="190" height="64" rx="10" fill="#FAFAF8" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="145" y="296" text-anchor="middle" fill="#111210" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">session.env</text>
  <text x="145" y="315" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="9.5">0600 · token + base URL</text>

  <rect x="400" y="270" width="230" height="64" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.8"/>
  <text x="515" y="296" text-anchor="middle" fill="#0E7490" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">Agent / MCP client</text>
  <text x="515" y="315" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="9.5">process / stdio client</text>

  <line x1="240" y1="148" x2="400" y2="148" stroke="#111210" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="139" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="9.5">authorize</text>

  <line x1="630" y1="148" x2="740" y2="148" stroke="#111210" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="685" y="139" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="9.5">filter + log</text>

  <line x1="400" y1="191" x2="240" y2="286" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-soft)"/>
  <text x="280" y="220" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="9.5">write 0600 env</text>

  <line x1="240" y1="302" x2="400" y2="302" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-soft)"/>
  <text x="320" y="292" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="9.5">source / read</text>

  <line x1="515" y1="270" x2="515" y2="191" stroke="#111210" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="527" y="235" text-anchor="start" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="9.5">HTTP + Bearer</text>

  <text x="480" y="362" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="9.5">The token lives in a 0600 env file; Guard checks scope, expiry, and revocation and writes an audit entry per request</text>
</svg>
