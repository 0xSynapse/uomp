<svg viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MCP 路径">
  <rect x="0" y="0" width="960" height="360" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#111210"/></marker>
    <marker id="arrow-soft" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#6B7280"/></marker>
  </defs>

  <text x="480" y="32" text-anchor="middle" fill="#0E7490" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">MCP 路径（本地适配器，实验）</text>
  <text x="480" y="55" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="11">MCP 客户端 ⇄ stdio JSON-RPC ⇄ uomp mcp ⇄ HTTP + Bearer ⇄ Auth + Guard</text>

  <rect x="50" y="110" width="220" height="76" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.8"/>
  <text x="160" y="143" text-anchor="middle" fill="#0E7490" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">MCP 客户端</text>
  <text x="160" y="163" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="9.5">Claude Desktop / Cursor / OpenCode</text>

  <rect x="360" y="110" width="200" height="76" rx="10" fill="#FFFFFF" stroke="#111210" stroke-width="2"/>
  <text x="460" y="143" text-anchor="middle" fill="#111210" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">uomp mcp</text>
  <text x="460" y="163" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="10">stdio bridge</text>

  <rect x="650" y="110" width="250" height="76" rx="10" fill="#FFFFFF" stroke="#111210" stroke-width="2"/>
  <text x="775" y="143" text-anchor="middle" fill="#111210" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Auth + Guard</text>
  <text x="775" y="163" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="10">127.0.0.1:9374</text>

  <rect x="360" y="260" width="200" height="64" rx="10" fill="#FAFAF8" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="460" y="286" text-anchor="middle" fill="#111210" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">session.env 0600</text>
  <text x="460" y="305" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="9.5">UOM_TOKEN + base URL</text>

  <rect x="650" y="260" width="250" height="64" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.8"/>
  <text x="775" y="286" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">Store + Audit</text>
  <text x="775" y="305" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="9.5">SQLite + audit log</text>

  <line x1="270" y1="148" x2="360" y2="148" stroke="#111210" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="315" y="139" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="9.5">stdio</text>

  <line x1="560" y1="148" x2="650" y2="148" stroke="#111210" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="605" y="139" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="9.5">HTTP + Bearer</text>

  <line x1="460" y1="260" x2="460" y2="186" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-soft)"/>
  <text x="472" y="226" text-anchor="start" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="9.5">re-read token</text>

  <line x1="775" y1="186" x2="775" y2="260" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-soft)"/>
  <text x="787" y="226" text-anchor="start" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="9.5">filter / log</text>

  <text x="480" y="348" text-anchor="middle" fill="#62655F" font-family="Inter, system-ui, sans-serif" font-size="9.5">MCP bridge 只做传输适配；scope、过期、撤销和审计仍由 Guard 执行</text>
</svg>
